name: Test personnel form
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: git diff --exit-code -- apps-script/Code.gs
      - run: node scripts/build-pages.mjs
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: NRCO-Google-Only
          path: |
            google-only/Code.gs
            google-only/Index.html
            google-only/appsscript.json
            google-only/README.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NRCO-GitHub-Pages
          path: |
            github-pages/Code.gs
            github-pages/Index.html
            github-pages/appsscript.json
            github-pages/README.md
          if-no-files-found: error
